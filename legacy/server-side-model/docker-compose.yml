version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Permite o backend gerenciar containers "irmãos" no Docker do HOST
      - /var/run/docker.sock:/var/run/docker.sock
      # Monta a pasta de labs por fora do container, assim um `git pull`
      # depois de um merge de PR já reflete sem rebuild da imagem
      - ./labs:/labs:ro
    environment:
      - LABS_DIR=/labs
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
