name: Release CLI

# Dispara numa tag v*.*.* (ex: v0.1.0) — builda os 5 binários
# multi-plataforma (linux/amd64+arm64, darwin/amd64+arm64,
# windows/amd64), gera checksums.txt, assina com cosign via GitHub OIDC
# (keyless, sem chave privada em secret) e publica tudo em GitHub
# Releases. Ver cli/.goreleaser.yml e cli/README.md.
#
# NOTA: este workflow ainda não rodou de verdade (o repositório não tem
# remote no GitHub nesta sessão, e cli/.goreleaser.yml não foi validado
# com `goreleaser` de verdade — ver a nota no topo daquele arquivo).
# Antes da primeira tag real, rode `goreleaser release --snapshot
# --clean` localmente dentro de cli/ pra conferir que builda certo.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # criar a release e subir os artefatos
  id-token: write # assinatura keyless do cosign via OIDC

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser precisa do histórico pra gerar o changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: cli/go.sum

      - uses: sigstore/cosign-installer@v3

      - name: Rodar GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: cli
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
