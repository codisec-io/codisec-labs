name: Deploy do site

# Builda catalog.json a partir dos labs/*/lab.yaml e publica o site
# Astro no Cloudflare Pages a cada push em main que mexa em site/ ou
# labs/. 100% Node — a geração do catálogo (site/scripts/build-catalog.mjs)
# roda como parte de `npm run build` (hook "prebuild"), sem dependência
# de Python no pipeline (ver docs/SECURITY.md/histórico: a versão
# anterior em Python quebrou o deploy por depender de `pip install`
# rodar num ambiente que não tinha).
#
# Alternativa mais simples (menos secrets pra gerenciar): configurar o
# Cloudflare Pages nativo (painel → Pages → Git integration) com build
# command `npm --prefix site ci && npm --prefix site run build` e
# output directory `site/dist` — sem precisar deste workflow nem dos
# secrets CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID. Optamos pela
# versão com Action explícita por dar mais controle e logs mais
# transparentes, mas as duas funcionam (ver docs/DEPLOY.md).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "labs/**"
      - ".github/workflows/deploy-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências do site
        working-directory: site
        run: npm ci

      - name: Build do site
        # `npm run build` já roda site/scripts/build-catalog.mjs sozinho
        # via o hook "prebuild" (ver site/package.json) — não precisa de
        # um passo separado pra gerar o catalog.json antes.
        working-directory: site
        run: npm run build

      - name: Deploy no Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: codisec-labs
          directory: site/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
